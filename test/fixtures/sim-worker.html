<!doctype html><title>sim worker</title><body>
<script>
// The many-agent endgame: the simulation in a Worker, the page only drawing.
// The worker is saturated (a 15 ms step every 16 ms); the main thread is
// light. A page-only profile reads this as healthy.
// ?step=57&every=75: a decoupled sim on its own loop instead — 57 ms a
// tick, 75% busy, never saturated (dmitriy's field case).
const q = new URLSearchParams(location.search);
const step = Number(q.get('step') ?? 15), every = Number(q.get('every') ?? 16);
const src = `
function stepAgents(n) {
  const until = performance.now() + ${step};
  let x = 0;
  while (performance.now() < until) x += Math.sqrt(x + n);   // the per-agent update
  return x;
}
let tick = 0;
// ?marks=1: the sim marks each tick (__sloptimizeTickMs, defined by the attach before this runs).
const marks = ${q.get('marks') === '1'};
setInterval(() => { const t0 = performance.now(); stepAgents(9000); if (marks && self.__sloptimizeTickMs) self.__sloptimizeTickMs(performance.now() - t0); postMessage(++tick); }, ${every});
`;
const sim = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })), { name: 'sim' });
let ticks = 0;
sim.onmessage = (e) => { ticks = e.data; };
function draw() {
  requestAnimationFrame(draw);
  const until = performance.now() + 2;
  while (performance.now() < until) {}
}
requestAnimationFrame(draw);
</script></body>
